[package]
name = "multiobjective-search"
description = "Multi-objective shortest paths: BOA*, BOBA*, EMOA* and NAMOA* over Pareto frontiers"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/multiobjective-search"
readme = "README.md"
keywords = ["search", "pareto", "multi-objective", "astar", "pathfinding"]
categories = ["algorithms", "no-std"]

[features]
## Links `std`. No API of its own; required by `parallel`.
std = []
## Multi-threaded BOBA* (`boba_star_parallel`, `boba_star_with_parallel`)
## on `std::thread::scope`.
parallel = ["std"]

[dependencies]
search-core = { path = "../search-core", version = "0.1" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "search"
harness = false

[package.metadata.docs.rs]
all-features = true
