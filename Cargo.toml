[package]
name = "multiobjective-search"
description = "Multi-objective shortest paths: BOA*, BOBA*, EMOA* and NAMOA* over Pareto frontiers"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/multiobjective-search"
readme = "README.md"
keywords = ["search", "pareto", "multi-objective", "astar", "pathfinding"]
categories = ["algorithms", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[features]
## Links `std`. No API of its own; required by `parallel`.
std = []
## Multi-threaded BOBA* (`boba_star_parallel`, `boba_star_with_parallel`)
## on `std::thread::scope`.
parallel = ["std"]

[dependencies]
search-core = "0.3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "search"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]
