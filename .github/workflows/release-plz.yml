# release-plz (git-only mode): keeps a release PR up to date on every push to main and, once it
# is merged, creates the vX.Y.Z tag and GitHub Releases. It never publishes: the
# tag push starts publish-crates-io.yml, which publishes from the tag-restricted `crates-io` environment.
# The App token matters: tags and PRs created with GITHUB_TOKEN would not trigger other workflows.
# Dormant until the repository variable RELEASE_APP_CLIENT_ID is set: both jobs are skipped
# without it, so pushes to main do not fail at the App-token step.
# search-core is a path dependency: checkout-siblings puts this crate in multiobjective-search/
# and search-core next to it, so release-plz gets the crate's manifest and config paths.
name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz-release:
    name: Release-plz release
    if: github.repository_owner == 'sunsided' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # No concurrency group here: cancelling a pending run could skip a release.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: $/.github/actions/checkout-siblings
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          manifest_path: multiobjective-search/Cargo.toml
          config: multiobjective-search/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    name: Release-plz PR
    if: github.repository_owner == 'sunsided' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: $/.github/actions/checkout-siblings
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          manifest_path: multiobjective-search/Cargo.toml
          config: multiobjective-search/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
